name: Release

# v0.1.0 같은 태그를 올리면 설치 파일(LAPIS-Setup.exe)과 zip 을 만들어 릴리스에 붙인다.
# 태그를 올릴 수 없을 때는 Actions 에서 직접 실행하면 package.json 의 버전으로 태그(vX.Y.Z)를 만들어 릴리스한다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build:installer
      - id: ver
        shell: pwsh
        run: '"tag=v$((Get-Content package.json -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/LAPIS-Setup.exe
            dist/ai-office-app.zip
          generate_release_notes: true
