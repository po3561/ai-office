<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>라피스 · 물품 대여</title>
<style>
  :root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#5b6777;--line:#dbe1e8;--pri:#1f6feb;--pri-tx:#fff;--ok:#12805c;--warn:#b26a00;--err:#c62828;--chip:#eef2f6;--side-w:224px}
  @media (prefers-color-scheme:dark){:root{--bg:#12171d;--card:#1c232c;--tx:#e8edf2;--mut:#a3aebc;--line:#2f3945;--pri:#4c8dff;--pri-tx:#08111f;--ok:#4cc39a;--warn:#f0b34a;--err:#ff8a8a;--chip:#263039}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5}
  /* ---------- 좌측 사이드바 대시보드 레이아웃 ---------- */
  .layout{display:flex;min-height:100vh}
  .sidebar{width:var(--side-w);flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:8}
  .side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 14px;border-bottom:1px solid var(--line)}
  .side-head b{font-size:16px;line-height:1.3}
  .side-close{display:none}
  .side-nav{flex:1;overflow-y:auto;padding:10px}
  .side-nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:var(--tx);border:0;border-radius:10px;padding:11px 12px;font:inherit;font-weight:600;margin-bottom:3px;cursor:pointer}
  .side-nav button .ic{font-size:16px;width:20px;text-align:center;flex:none}
  .side-nav button.on{background:var(--pri);color:var(--pri-tx)}
  .side-nav button:hover:not(.on){background:var(--chip)}
  .side-foot{padding:12px;border-top:1px solid var(--line)}
  .side-foot button{width:100%}
  .content{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:none;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
  .topbar b{font-size:16px;flex:1}
  .hamburger{background:var(--chip);color:var(--tx);border:0;border-radius:9px;padding:8px 12px;font:inherit;font-size:18px;line-height:1;cursor:pointer}
  .overlay{display:none}
  main{max-width:1100px;margin:0 auto;padding:14px 16px 60px;width:100%}
  @media (max-width:860px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .22s ease;box-shadow:2px 0 20px #0004;z-index:15}
    .sidebar.open{transform:translateX(0)}
    .side-close{display:inline-block}
    .topbar{display:flex}
    .overlay.show{display:block;position:fixed;inset:0;background:#0007;z-index:14}
  }
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  h2{font-size:17px;margin:0 0 10px} h3{font-size:15px;margin:10px 0 6px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .stat b{display:block;font-size:26px}.stat span{color:var(--mut);font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
  th{color:var(--mut);font-weight:600;font-size:13px}
  /* 좁은 화면에서는 칸이 줄바꿈되어 잘게 쪼개지는 대신(가독성 저하), 표 전체를 가로로 스크롤한다 */
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  tr.click{cursor:pointer} tr.click:hover{background:var(--chip)}
  .pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--chip)}
  .pill.연체,.pill.파손,.pill.부족,.pill.완전파손,.pill.대여불가{background:#c6282822;color:var(--err)}
  .pill.대여중{background:#1f6feb22;color:var(--pri)} .pill.반납완료{background:#12805c22;color:var(--ok)} .pill.신청{background:#b26a0022;color:var(--warn)}
  .pill.양호{background:#12805c22;color:var(--ok)} .pill.부분파손,.pill.수리중{background:#b26a0022;color:var(--warn)}
  button,.btn{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:9px 14px;font-weight:700;background:var(--pri);color:var(--pri-tx);text-decoration:none;display:inline-block}
  button.sec,.btn.sec{background:var(--chip);color:var(--tx)}
  button.danger{background:var(--err);color:#fff}
  input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--tx);max-width:100%}
  input[type=checkbox]{width:auto}
  label{display:block;font-weight:600;font-size:13px;margin:8px 0 3px;color:var(--mut)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
  .photos{display:flex;gap:6px;flex-wrap:wrap}
  .photos img{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#0002}
  .msg{padding:10px 12px;border-radius:9px;margin:8px 0;font-size:14px}
  .msg.err{background:#c6282822;color:var(--err)} .msg.ok{background:#12805c22;color:var(--ok)} .msg.warn{background:#b26a0022;color:var(--warn)}
  .mut{color:var(--mut)} .small{font-size:13px}
  code{background:var(--chip);padding:2px 6px;border-radius:6px;word-break:break-all}
  #login{max-width:360px;margin:12vh auto;padding:0 16px}
  #zoom{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:20}
  #zoom img{max-width:96vw;max-height:92vh}
  .cards-m{display:none}
  @media (max-width:640px){.hide-m{display:none}}
</style>
<link rel="stylesheet" href="/module-theme.css"></head>
<body>
<div id="root"></div>
<div id="zoom" onclick="this.style.display='none'"><img alt="확대 사진"></div>
<script>
(() => {
  'use strict';
  const root = document.getElementById('root');
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') e.className = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
    return e;
  }
  function timeoutSignal(ms) { try { return AbortSignal.timeout(ms); } catch { return undefined; } }
  async function api(path, body, raw) {
    let res;
    try {
      res = await fetch('/rental/admin/api' + path, {
        method: body === undefined ? 'GET' : 'POST',
        headers: raw ? { 'content-type': 'image/jpeg', 'x-lapis-request': '1' } : body === undefined ? {} : { 'content-type': 'application/json', 'x-lapis-request': '1' },
        body: body === undefined ? undefined : raw ? body : JSON.stringify(body),
        signal: timeoutSignal(raw ? 60000 : 20000),
      });
    } catch (e) {
      if (e && (e.name === 'AbortError' || e.name === 'TimeoutError')) throw new Error('요청이 너무 오래 걸립니다. 네트워크 상태를 확인하고 다시 시도해 주세요.');
      throw new Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.');
    }
    let d = {}; try { d = await res.json(); } catch {}
    if (res.status === 401 && path !== '/login') { loginView(); throw new Error('로그인이 필요합니다.'); }
    if (!res.ok || d.ok === false) throw new Error(d.error || '요청 실패');
    return d;
  }
  const photoUrl = (k) => '/rental/admin/photo?k=' + encodeURIComponent(k);
  function photos(keys) {
    return el('div', { class: 'photos' }, (keys || []).map((k) => el('img', { src: photoUrl(k), loading: 'lazy', alt: '사진', onclick: (e) => { e.stopPropagation(); const z = document.getElementById('zoom'); z.querySelector('img').src = e.target.src; z.style.display = 'grid'; } })));
  }
  const pill = (s) => el('span', { class: 'pill ' + s }, s);
  const stat = (n, l) => el('div', { class: 'stat' }, el('b', {}, String(n)), el('span', {}, l));
  const msg = (kind, text) => el('div', { class: 'msg ' + kind, role: 'status' }, text);
  function flash(host, kind, text) { const m = msg(kind, text); host.prepend(m); setTimeout(() => m.remove(), 6000); }
  async function toJpeg(file) {
    let bmp; try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch { bmp = await createImageBitmap(file); }
    const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('변환 실패'))), 'image/jpeg', 0.82));
  }
  const tblRows = (rows) => rows;
  const CATALOG_STATUSES = ['양호', '부분파손', '수리중', '대여중', '완전파손', '대여불가'];
  // 물품 사진 촬영(카메라)·이미지 업로드(갤러리/PC 파일)를 함께 제공하는 위젯.
  // "빠른 등록"과 물품 수정 화면에서 공용으로 쓴다. initialKey가 있으면 시작 사진으로 보여주고,
  // 새로 고르지 않으면 그대로(기존 사진 key) 유지된다.
  // 사진을 올리는 동안 저장을 누르면 사진 없이 저장되던 문제: ready()가 올리기가 끝날 때까지 기다린다.
  function photoPicker(host, initialKey) {
    let photoKey = initialKey || null;
    let pending = Promise.resolve();
    const thumb = el('div', { class: 'photos' });
    if (initialKey) thumb.replaceChildren(photos([initialKey]));
    const state = el('span', { class: 'mut small', role: 'status' });
    const capture = el('input', { type: 'file', accept: 'image/*', capture: 'environment', hidden: true });
    const upload = el('input', { type: 'file', accept: 'image/*', hidden: true });
    function handle(fl) {
      if (!fl) return;
      state.textContent = '사진 올리는 중...';
      pending = (async () => {
        try { const b = await toJpeg(fl); const r = await api('/photo', b, true); photoKey = r.key; thumb.replaceChildren(photos([r.key])); state.textContent = ''; }
        catch (e) { state.textContent = ''; flash(host, 'err', '사진을 올리지 못했습니다: ' + e.message); }
      })();
      return pending;
    }
    capture.addEventListener('change', () => { const f = capture.files[0]; capture.value = ''; handle(f); });
    upload.addEventListener('change', () => { const f = upload.files[0]; upload.value = ''; handle(f); });
    const node = el('div', {}, thumb,
      el('div', { style: 'display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center' },
        el('button', { type: 'button', class: 'sec', onclick: () => capture.click() }, '📷 사진 촬영'),
        el('button', { type: 'button', class: 'sec', onclick: () => upload.click() }, '🖼️ 이미지 업로드'), state),
      capture, upload);
    return { node, getKey: () => photoKey, ready: () => pending };
  }
  // 저장 버튼: 누르는 동안 막아 두 번 눌러 같은 물품이 두 개 생기지 않게 한다.
  function busyButton(label, attrs, fn) {
    const b = el('button', { ...attrs, onclick: async () => {
      if (b.disabled) return;
      b.disabled = true; b.textContent = '저장 중...';
      try { await fn(); } finally { if (b.isConnected) { b.disabled = false; b.textContent = label; } }
    } }, label);
    return b;
  }
  const digitsOf = (s) => String(s || '').replace(/\D/g, '');

  /* ---------- 로그인 ---------- */
  function loginView() {
    const pw = el('input', { type: 'password', autocomplete: 'current-password', style: 'width:100%' });
    const box = el('div');
    const form = el('form', { onsubmit: async (e) => {
      e.preventDefault();
      try {
        await api('/login', { password: pw.value });
        const next = new URLSearchParams(location.search).get('next');
        if (next && next.startsWith('/rental/admin/photo')) { location.href = next; return; }
        start();
      } catch (ex) { box.replaceChildren(msg('err', ex.message)); }
    } }, el('label', {}, '관리자 비밀번호'), pw, box, el('button', { style: 'margin-top:12px;width:100%' }, '로그인'));
    root.replaceChildren(el('div', { id: 'login' }, el('h2', {}, '무인 창고 운영시스템 관리자'), el('div', { class: 'card' }, form)));
    pw.focus();
  }

  /* ---------- 공통 프레임 (좌측 사이드바 대시보드) ---------- */
  const TABS = [
    ['home', '📊', '현황'], ['rentals', '📋', '대여 기록'], ['events', '🚪', '입출입 기록'],
    ['collected', '🖼️', '사진으로 모은 물품'], ['catalog', '📦', '물품목록'], ['settings', '⚙️', '설정·내려받기'],
  ];
  let tab = 'home';
  const main = el('main');
  const sideNav = el('nav', { class: 'side-nav' });
  const topbarTitle = el('b', {}, '현황');
  const sidebar = el('aside', { class: 'sidebar', id: 'sidebar' },
    el('div', { class: 'side-head' }, el('b', {}, '무인 창고 운영시스템', el('br'), '관리자'), el('button', { class: 'sec side-close', onclick: () => closeSidebar() }, '✕')),
    sideNav,
    el('div', { class: 'side-foot' }, el('button', { class: 'sec', onclick: async () => { try { await api('/logout', {}); } catch {} loginView(); } }, '로그아웃')));
  const overlay = el('div', { class: 'overlay', id: 'overlay', onclick: () => closeSidebar() });
  function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('show'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('show'); }
  function start() {
    sideNav.replaceChildren(...TABS.map(([k, ic, t]) => el('button', { class: k === tab ? 'on' : '', onclick: () => { go(k); closeSidebar(); } }, el('span', { class: 'ic' }, ic), t)));
    root.replaceChildren(
      el('div', { class: 'layout' },
        sidebar, overlay,
        el('div', { class: 'content' },
          el('div', { class: 'topbar' }, el('button', { class: 'hamburger', onclick: () => openSidebar() }, '☰'), topbarTitle),
          main)));
    const mr = /^#rental=(R-\d{8}-\d+)$/.exec(location.hash);
    const mc = /^#item=([A-Za-z0-9_-]+)$/.exec(location.hash);
    if (mr) rentalDetail(mr[1]); else if (mc) catalogDetail(mc[1]); else go(tab);
  }
  function go(k, arg) {
    tab = k; history.replaceState(null, '', location.pathname);
    [...sideNav.children].forEach((b, i) => b.classList.toggle('on', TABS[i][0] === k));
    topbarTitle.textContent = (TABS.find((t) => t[0] === k) || [, , k])[2];
    main.replaceChildren(el('p', { class: 'mut' }, '불러오는 중...'));
    ({ home: homeView, rentals: rentalsView, events: eventsView, collected: collectedView, catalog: catalogView, settings: settingsView })[k](arg).catch((e) => main.replaceChildren(msg('err', e.message)));
  }

  /* ---------- 현황 ---------- */
  async function homeView() {
    const s = await api('/summary');
    const c = s.counts;
    // 숫자 칸을 누르면 그 상태만 걸러 낸 대여 기록으로 간다.
    const jump = (node, where, filter) => { node.style.cursor = 'pointer'; node.title = '눌러서 보기'; node.addEventListener('click', () => go(where, filter)); return node; };
    const nodes = [
      el('div', { class: 'stats' }, jump(stat(c.pending, '출고 대기(신청)'), 'rentals', '신청'), jump(stat(c.out, '대여중'), 'rentals', '대여중'), jump(stat(c.overdue, '연체'), 'rentals', '연체'), stat(c.dueToday, '오늘 반납 예정'), jump(stat(c.catalog, '등록 물품 종류'), 'catalog'), stat(c.photos, '보관 사진')),
    ];
    if (!s.passwordSet) nodes.unshift(el('div', { class: 'msg err' }, '창고 비밀번호가 아직 없습니다. "설정·내려받기" 탭에서 입력해야 대여자에게 비밀번호가 표시됩니다.'));
    if (!s.telegram) nodes.unshift(el('div', { class: 'msg warn' }, '텔레그램 알림이 설정되지 않았습니다.'));
    nodes.push(el('div', { class: 'card' }, el('h2', {}, '진행 중인 대여'), rentalTable(s.open, '진행 중인 대여가 없습니다.')));
    main.replaceChildren(...nodes);
  }
  function rentalTable(rows, emptyText) {
    if (!rows.length) return el('p', { class: 'mut' }, emptyText || '기록이 없습니다.');
    return el('div', { class: 'tblwrap' }, el('table', {},
      el('thead', {}, el('tr', {}, ['대여번호', '상태', '대여자', '연락처', '물품', '수령', '반납예정', '표시'].map((h) => el('th', { class: ['연락처', '수령'].includes(h) ? 'hide-m' : '' }, h)))),
      el('tbody', {}, rows.map((r) => el('tr', { class: 'click', onclick: () => rentalDetail(r.rental_no) },
        el('td', {}, r.rental_no), el('td', {}, pill(r.status)), el('td', {}, `${r.name}${r.region ? ' (' + r.region + ')' : ''}`), el('td', { class: 'hide-m' }, r.phone),
        el('td', {}, r.items || ''), el('td', { class: 'hide-m' }, r.pickup_at), el('td', {}, r.return_at),
        el('td', {}, [r.issue ? pill('부족') : null, r.warn_short_notice ? el('span', { class: 'pill', title: '3일 미만 신청' }, '3일미만') : null]))))));
  }

  /* ---------- 대여 기록 / 상세 ---------- */
  async function rentalsView(filter) {
    const d = await api('/rentals');
    const q = el('input', { placeholder: '이름·전화번호·물품·대여번호 검색', style: 'width:100%;max-width:320px' });
    const st = el('select', {}, ['전체', '신청', '대여중', '연체', '반납완료', '취소'].map((s) => el('option', { selected: s === filter }, s)));
    const box = el('div');
    const draw = () => {
      const t = q.value.trim().toLowerCase();
      // 전화번호는 하이픈 없이 숫자만 넣어도 찾는다.
      const td = digitsOf(t);
      const rows = d.rentals.filter((r) => (st.value === '전체' || r.status === st.value) && (!t || `${r.name} ${r.rental_no} ${r.items} ${r.region} ${r.phone}`.toLowerCase().includes(t) || (td.length >= 4 && digitsOf(r.phone).includes(td))));
      box.replaceChildren(rentalTable(rows, '조건에 맞는 기록이 없습니다.'));
    };
    q.addEventListener('input', draw); st.addEventListener('change', draw); draw();
    main.replaceChildren(el('div', { class: 'card' }, el('h2', {}, `대여 기록 (${d.rentals.length}건)`), el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px' }, q, st), box));
  }
  async function rentalDetail(no) {
    main.replaceChildren(el('p', { class: 'mut' }, '불러오는 중...'));
    try {
      const d = await api('/rentals/' + no); const r = d.rental;
      const host = el('div');
      const act = (path, label, cls, ask) => el('button', { class: cls || 'sec', onclick: async () => {
        const reason = ask ? prompt(ask) : ''; if (ask && reason === null) return;
        try { await api(`/rentals/${no}/${path}`, { reason }); rentalDetail(no); } catch (e) { flash(host, 'err', e.message); }
      } }, label);
      main.replaceChildren(host,
        el('button', { class: 'sec', onclick: () => go(tab) }, '← 목록'),
        el('div', { class: 'card' }, el('h2', {}, r.rental_no, ' ', pill(r.status)),
          el('p', {}, `${r.name} (${r.region || '-'}) · ${r.phone}`),
          el('p', { class: 'mut' }, `목적: ${r.purpose || '-'}`),

        el('td', {}, photos([...r.photos_out.slice(0, 2), ...r.photos_back.slice(0, 2)])))))));
  }

  /* ---------- 대여 이력 초기화(6개월 주기) 상태·실행 ----------
     부과장님 확인(2026-09-27): 사이드바 메뉴 아이콘 추가(완료), "사진으로 모은 물품" 탭 유지(완료),
     대여 이력 초기화 버튼 추가 - 확인 대화상자 2단계 + CSV 먼저 내려받기 안내. */
  function historyResetCard(host) {
    const box = el('div', { class: 'card' }, el('p', { class: 'mut' }, '불러오는 중...'));
    async function draw() {
      const s = await api('/history-reset');
      const rows = [
        el('h2', {}, '대여 이력 초기화 (6개월 주기)'),
        el('p', { class: 'small' }, '마지막 초기화: ', el('b', {}, s.last_reset_at || '없음(아직 실행된 적 없음)')),
        el('p', { class: 'small' }, '지금 초기화 대상(반납완료 건): ', el('b', {}, String(s.candidate_count) + '건')),
        el('p', { class: 'mut small' }, `반납완료 건은 ${s.threshold_days}일이 지나면 자동으로 정리됩니다. 지우기 전 텔레그램으로 예고가 오고, 실제 삭제는 그 다음 날 자동 점검 때 이루어집니다(이중 확인). 지운 자료(기록·사진)는 삭제하지 않고 R2에 백업해 관리자가 계속 열람할 수 있습니다.`),
      ];
      if (s.pending) {
        rows.push(el('div', { class: 'msg warn' }, `⚠ 초기화 예고됨: ${s.pending.count}건 (${s.pending.requested_at}) — 다음 자동 점검 때 실제로 삭제됩니다. 원치 않으면 "보류 취소"를 누르세요.`));
      }
      const btns = el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin-top:10px' },
        el('a', { class: 'btn sec', href: '/rental/admin/api/export/rentals.csv', download: '' }, '① CSV 먼저 내려받기'),
        el('button', { class: 'sec', onclick: async () => {
          try { await api('/history-reset/check', {}); await draw(); flash(host, 'ok', '지금 점검했습니다.'); } catch (e) { flash(host, 'err', e.message); }
        } }, '지금 점검(예고 확인)'),
        s.pending ? el('button', { class: 'sec', onclick: async () => {
          try { await api('/history-reset/cancel', {}); await draw(); flash(host, 'ok', '보류를 취소했습니다. 다음 점검 때 예고부터 다시 시작합니다.'); } catch (e) { flash(host, 'err', e.message); }
        } }, '보류 취소') : null,
        el('button', { class: 'danger', onclick: async () => {
          if (s.candidate_count === 0) return flash(host, 'warn', '지금은 초기화할 대상이 없습니다.');
          if (!confirm(`반납완료 ${s.candidate_count}건을 지금 삭제하고 R2에 백업합니다.\n\n삭제 전 위 "① CSV 먼저 내려받기"로 대여대장을 내려받으셨나요?\n\n받으셨다면 확인을 눌러 계속하세요.`)) return;
          if (!confirm('정말로 지금 실행하시겠습니까?\n\n실행 즉시 처리되며 되돌릴 수 없습니다(단, 기록·사진은 R2에 백업되어 관리자만 계속 열람할 수 있습니다).')) return;
          try { const r = await api('/history-reset/run-now', {}); await draw(); flash(host, 'ok', `처리 ${r.count}건, 사진 ${r.photosArchived}장 백업 완료.`); } catch (e) { flash(host, 'err', e.message); }
        } }, '② 즉시 실행'));
      box.replaceChildren(...rows, btns);
    }
    draw().catch((e) => box.replaceChildren(msg('err', e.message)));
    return box;
  }

  /* ---------- 설정 · 내려받기 ---------- */
  async function settingsView() {
    const s = await api('/summary');
    const host = el('div');
    const pw = el('input', { type: 'text', autocomplete: 'off', placeholder: '새 창고 비밀번호', style: 'width:100%;max-width:280px' });
    const dl = (k, t) => el('a', { class: 'btn sec', href: `/rental/admin/api/export/${k}.csv`, download: '' }, t);
    main.replaceChildren(host,
      el('div', { class: 'card' }, el('h2', {}, '창고 비밀번호'),
        el('p', { class: 'mut small' }, s.passwordSet ? `설정됨 (마지막 변경 ${s.passwordUpdated}). 보안을 위해 현재 값은 화면에 표시하지 않습니다.` : '아직 설정되지 않았습니다.'),
        el('p', { class: 'mut small' }, '여기에 입력한 번호가 대여 신청 완료 화면과 반납 화면에 표시됩니다. 창고 도어락 번호와 똑같이 맞춰 주세요.'),
        pw, ' ', el('button', { onclick: async () => {
          if (!pw.value.trim()) return flash(host, 'err', '비밀번호를 입력하세요.');
          try { await api('/settings', { warehouse_password: pw.value }); pw.value = ''; flash(host, 'ok', '창고 비밀번호를 저장했습니다.'); settingsView(); } catch (e) { flash(host, 'err', e.message); }
        } }, '저장')),
      el('div', { class: 'card' }, el('h2', {}, '대여자용 입구 QR 주소'),
        el('p', { class: 'mut small' }, '이 주소가 QR 코드에 들어 있습니다. 외부에 공개하지 마세요(창고 입구 QR로만 배포).'),
        s.entryUrl ? el('p', {}, el('code', {}, s.entryUrl)) : msg('err', '입구 토큰이 설정되지 않았습니다.')),
      el('div', { class: 'card' }, el('h2', {}, '텔레그램 알림'), el('p', { class: 'mut small' }, s.telegram ? '연결됨' : '연결되지 않음'),
        el('button', { class: 'sec', onclick: async () => { try { const t = await api('/telegram-test', {}); flash(host, t.sent ? 'ok' : 'err', t.sent ? '테스트 알림을 보냈습니다. 텔레그램을 확인하세요.' : '텔레그램 전송에 실패했습니다.'); } catch (e) { flash(host, 'err', e.message); } } }, '테스트 알림 보내기')),
      el('div', { class: 'card' }, el('h2', {}, 'CSV 내려받기 (엑셀에서 한글 정상 표시)'),
        el('p', { class: 'mut small' }, '물품목록·대여대장은 업무데이터/물품대여의 CSV와 같은 열 구성입니다.'),
        el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' }, dl('catalog', '물품목록.csv'), dl('rentals', '대여대장.csv'), dl('events', '입출입기록.csv'), dl('collected', '수집물품.csv'))),
      historyResetCard(host));
  }

  /* ---------- 시작 ---------- */
  (async () => {
    try { await api('/summary'); start(); } catch (e) { loginView(); }
  })();
  // 크게 본 사진은 Esc 로도 닫는다.
  document.addEventListener('keydown', (e) => { const z = document.getElementById('zoom'); if (e.key === 'Escape' && z.style.display === 'grid') z.style.display = 'none'; });
  window.addEventListener('hashchange', () => {
    if (!root.querySelector('.sidebar')) return;
    const mr = /^#rental=(R-\d{8}-\d+)$/.exec(location.hash); if (mr) return rentalDetail(mr[1]);
    const mc = /^#item=([A-Za-z0-9_-]+)$/.exec(location.hash); if (mc) return catalogDetail(mc[1]);
  });
})();
</script>
</body>
</html>
